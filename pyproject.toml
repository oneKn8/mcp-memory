[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory"
version = "0.1.0"
description = "MCP server for persistent agent memory with semantic search"
requires-python = ">= 3.11"
license = "MIT"
dependencies = [
    "fastmcp>=2.0.0",
    "chromadb>=1.0.0",
]

[project.scripts]
mcp-memory = "mcp_memory.server:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
# Analysis target matches the interpreter CI installs (3.12), not the lowest
# supported runtime. mypy parses third-party stubs with the grammar of this
# version, and numpy >= 2.5 (Python 3.12+ only) writes numpy/__init__.pyi with
# PEP 695 `type` aliases, which are a syntax error under "3.11". The package
# itself still installs and runs on 3.11 -- see requires-python.
python_version = "3.12"
